<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atividade de Listening – Travel</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --accent:#3b6ef5; --track:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:16px; }
  .card { background:var(--card); width:100%; max-width:440px; border-radius:16px; padding:28px;
          box-shadow:0 8px 30px rgba(0,0,0,.08); text-align:center; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:var(--muted); font-size:14px; }
  #play { width:84px; height:84px; border-radius:50%; border:none; background:var(--accent); color:#fff;
          font-size:34px; cursor:pointer; box-shadow:0 6px 16px rgba(59,110,245,.4); }
  #play:hover { filter:brightness(1.08); }
  .bar { margin:24px 0 8px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .times { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:8px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
  .row button, .row select { padding:8px 14px; border:1px solid var(--track); background:#fff; border-radius:8px;
          font-size:14px; cursor:pointer; color:var(--text); }
  .row button:hover { background:var(--bg); }
  #msg { margin-top:16px; font-size:13px; color:#b91c1c; min-height:18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎧 Listening: Travel</h1>
    <p class="sub">Ouça o áudio com atenção. Você pode ouvir quantas vezes precisar.</p>

    <audio id="audio" src="travel.mp3" preload="auto"></audio>

    <button id="play" aria-label="Tocar">▶</button>

    <div class="bar">
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posição do áudio">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>

    <div class="row">
      <button id="back">⏪ 5s</button>
      <button id="restart">↺ Recomeçar</button>
      <button id="fwd">5s ⏩</button>
      <select id="speed" aria-label="Velocidade">
        <option value="0.75">0,75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1,25x</option>
      </select>
    </div>

    <div id="msg"></div>
  </div>

  <script>
    const a = document.getElementById('audio');
    const play = document.getElementById('play');
    const seek = document.getElementById('seek');
    const cur = document.getElementById('cur');
    const dur = document.getElementById('dur');
    const msg = document.getElementById('msg');

    const fmt = s => {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60), r = Math.floor(s % 60);
      return m + ':' + String(r).padStart(2, '0');
    };

    play.onclick = () => a.paused ? a.play() : a.pause();
    a.onplay  = () => play.textContent = '⏸';
    a.onpause = () => play.textContent = '▶';
    a.onended = () => play.textContent = '▶';
    a.onloadedmetadata = () => dur.textContent = fmt(a.duration);
    a.ontimeupdate = () => {
      cur.textContent = fmt(a.currentTime);
      if (a.duration) seek.value = (a.currentTime / a.duration) * 100;
    };
    seek.oninput = () => { if (a.duration) a.currentTime = (seek.value / 100) * a.duration; };

    document.getElementById('back').onclick = () => a.currentTime = Math.max(0, a.currentTime - 5);
    document.getElementById('fwd').onclick = () => a.currentTime = Math.min(a.duration || 0, a.currentTime + 5);
    document.getElementById('restart').onclick = () => { a.currentTime = 0; a.play(); };
    document.getElementById('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);

    a.onerror = () => msg.textContent = 'Não foi possível carregar o áudio. Verifique se o arquivo travel.mp3 está na mesma pasta deste HTML.';
  </script>
</body>
</html>
